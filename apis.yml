description: East Meet East (now branded EME Hive) is a dating platform built specifically
  for Asian and Asian American singles across North America, founded by serial entrepreneur
  Mariko Tokioka. The service matches members using culture-aware criteria and is offered
  as consumer web and mobile apps. It was surfaced as a portfolio company of 500 Global and
  added to the API Evangelist network. As a consumer dating product it publishes no public
  developer API, SDKs, or /.well-known discovery surface; this profile captures its identity
  and public web properties (about, mission, blog, help center, terms, and privacy pages).
